# ---------- Application ----------
spring.application.name=ato-containment-service
server.port=8080

# ---------- MySQL ----------
# Defaults match database/init.sql. Override with environment variables if needed:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ato_db}
spring.datasource.username=${DB_USERNAME:ato_user}
spring.datasource.password=${DB_PASSWORD:ato_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# No JPA entities yet, so there is nothing for Hibernate to manage or validate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- CORS ----------
# Origins allowed to call the API from a browser (comma-separated).
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8000

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.ato.containment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{30} - %msg%n
# Also write logs to a file (relative to the folder you start the backend from, i.e. backend/logs/)
logging.file.name=logs/ato-containment.log
