# ---------- Application ----------
spring.application.name=ato-containment-service
server.port=8080

# ---------- PostgreSQL ----------
# Defaults match database/init.sql. Override with environment variables if needed:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ato_db}
spring.datasource.username=${DB_USERNAME:ato_user}
spring.datasource.password=${DB_PASSWORD:ato_password}

# ---------- JPA / Hibernate ----------
# No tables yet. Schema changes will be handled in later phases.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- CORS ----------
# Origins allowed to call the API from a browser (comma-separated).
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8000
